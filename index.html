<title>Slovíčka</title>

<style>
/* Layout: jedna úzka obrazovka pre mobil, karta s otázkou hore, veľké tlačidlá na palec dole.
   Farby: modrá z obálky učebnice, červená šípka ako značka. */
:root{
  --bg:#e9f0f7; --card:#ffffff; --ink:#13253b; --soft:#5d6f86; --line:#d3deea;
  --accent:#1d5ea8; --accent-ink:#ffffff; --brand:#c8382b;
  --ok:#1e8a4c; --ok-bg:#dff3e7; --bad:#c33a3a; --bad-bg:#fbe3e1; --hl:#ff4fa3;
  --f-disp:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1724; --card:#172435; --ink:#e6eef8; --soft:#93a5bc; --line:#26374d;
  --accent:#5b9be6; --accent-ink:#0b1420; --brand:#e2584a;
  --ok:#4cc883; --ok-bg:#163527; --bad:#f07068; --bad-bg:#3a1e20; --hl:#ff6fb5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1724; --card:#172435; --ink:#e6eef8; --soft:#93a5bc; --line:#26374d;
  --accent:#5b9be6; --accent-ink:#0b1420; --brand:#e2584a;
  --ok:#4cc883; --ok-bg:#163527; --bad:#f07068; --bad-bg:#3a1e20; --hl:#ff6fb5; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
main{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-disp);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:50px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ghost{background:none;border:0;min-height:40px;padding:6px 10px;color:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;flex:none}
.top .kniha{font-size:14px;color:var(--soft)}
.stats{margin-left:auto;text-align:right;font-size:13px;color:var(--soft);line-height:1.3;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:16px}
.progress{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
.summary{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);margin-bottom:6px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;font-size:15px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.chip .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;min-height:112px;border-radius:18px}
.tile .ico{font-family:var(--f-disp);font-weight:800;font-size:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--accent)}
.tile b{font-size:17px;line-height:1.2}
.tile small{color:var(--soft);font-size:13px;line-height:1.3}
.tile.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:84px}
.tile.big .txt{display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;min-height:40px;border-radius:10px;font-size:15px;padding:6px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.settings{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.settings label:last-child{border-bottom:0}
.settings input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.settings select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px}
/* kvíz */
.bar{display:flex;align-items:center;gap:10px}
.bar .progress{flex:1}
.bar .num{font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.q{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.prompt{font-family:var(--f-disp);font-weight:800;font-size:32px;line-height:1.15;word-break:break-word;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.prompt.emoji{font-size:84px;line-height:1.1}
.prompt.veta{font-family:var(--f-body);font-weight:700;font-size:23px;line-height:1.4}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);margin:0 4px;color:var(--accent)}
.say{min-height:40px;width:44px;padding:0;border-radius:50%;font-size:18px;flex:none}
.sub{color:var(--soft);font-size:15px}
.hint{font-size:15px;color:var(--accent);font-weight:700}
.opts{display:grid;gap:10px}
.opts button{text-align:left;font-size:19px;min-height:58px;padding:12px 16px;border-radius:16px}
.opts button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ok)}
.opts button.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.opts button:disabled{cursor:default}
.fb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fb .res{font-weight:700}
.fb .res.ok{color:var(--ok)}.fb .res.bad{color:var(--bad)}
.fb .ex{font-size:16px}
mark{background:none;color:var(--accent);font-weight:700}
/* kartičky */
.flash{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:300px;padding:24px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;cursor:pointer;width:100%}
.flash .front{font-family:var(--f-disp);font-weight:800;font-size:34px;line-height:1.15}
.flash .back{font-size:22px;font-weight:700;color:var(--accent)}
.flash .ex{color:var(--soft);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .no{color:var(--bad);font-weight:700}
.two .yes{color:var(--ok);font-weight:700}
/* písanie */
.write{width:100%;font-size:22px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:center}
.write.ok{border-color:var(--ok)}.write.bad{border-color:var(--bad)}
.letters{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:.15em;color:var(--accent)}
/* výsledok */
.score{font-family:var(--f-disp);font-weight:800;font-size:64px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:16px}
.list .it:last-child{border-bottom:0}
.list .it .en{font-weight:700;min-width:0;flex:1}
.list .it .sk{color:var(--soft);min-width:0;flex:1}
.list .it .L{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.empty{color:var(--soft);text-align:center;padding:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw;z-index:5}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;margin-left:auto;padding:0;min-height:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border:0;font-family:var(--f-disp);font-weight:800;font-size:20px}
.top > .avatar:first-child{margin-left:0}
.avatar.sm{width:36px;height:36px;font-size:16px;margin:0}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left;width:100%}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi b{font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--soft);line-height:1.2}
.heroTxt{grid-column:1/-1;font-size:13px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-variant-numeric:tabular-nums}
.day .col{height:70px;width:100%;max-width:26px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.day .col i{display:block;width:100%;background:var(--accent);border-radius:8px}
.day b{min-height:15px}.day small{color:var(--soft)}
.rows{display:flex;flex-direction:column;gap:10px}
.rowp{display:grid;grid-template-columns:1fr 70px 56px;grid-template-rows:auto auto;column-gap:10px;align-items:center;font-size:15px}
.rowp .progress{height:8px}
.rowp b{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rowp small{grid-column:1/-1;color:var(--soft);font-size:12px}
.pp{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.pp.bad{color:var(--bad)}
.cp{color:var(--soft);font-weight:400;font-size:12px}
.list.flat{border:0;border-radius:0;background:none}
.list.flat .it{padding-inline:0}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.level{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:110px;border-radius:18px}
.level b{font-family:var(--f-disp);font-weight:800;font-size:40px;line-height:1}
.level small{font-size:12px;color:var(--soft)}
.level.zamk{opacity:.45;cursor:not-allowed;border-style:dashed}
.level.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.it.prof{width:100%;border:0;border-radius:0;background:none;text-align:left;min-height:60px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

/* ============================ appka ============================ */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mix = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const den = d => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
function load(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ? Object.assign({}, d, v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

// profily: viac ľudí na jednom zariadení, každý má vlastný pokrok
let U = load('sl2_profily', { list: [], akt: null });
const NAST0 = { skup: {}, smer: 'mix', dlzka: 10, zvuk: true };
const UROVNE = [1, 2, 3, 4, 5, 6];
let S, D, K, P;
const kluc = k => 'sl2_' + U.akt + '_' + k;
const ulozS = () => save(kluc('nast'), S);
function prihlas(id){
  U.akt = id; save('sl2_profily', U);
  S = load(kluc('nast'), NAST0); S.skup = S.skup || {};
  D = load(kluc('dni'), {});
  if (!profil().uroven) return urovenObr();
  nastavKnihu() ? domov() : pripravujeme();
}
const profil = () => U.list.find(p => p.id === U.akt);

function pripravKnihu(k){
  if (k.w) return;
  const riadky = t => (t || '').trim().split('\n').map(r => r.trim()).filter(Boolean);
  k.w = riadky(k.slova).map(r => {
    const [en, sk, Ls, em, veta] = r.split('|').map(s => (s || '').trim());
    // lekcia „GL21“ = gramatická lekcia → skupina Frázy
    const L = /^GL/i.test(Ls) ? 1000 + parseInt(Ls.slice(2), 10) : parseInt(Ls, 10);
    return { id: en + '#' + Ls, en, sk, L, em, veta, ans: veta ? (veta.match(/\*(.+?)\*/) || [])[1] : '' };
  });
  // vety na doplnenie: vlastné vety slov + vety z kľúča knihy (pole vety)
  k.vt = k.w.filter(w => w.veta).map(w => ({ id: w.id, w, veta: w.veta, ans: w.ans }));
  k.vtChyby = [];
  riadky(k.vety).forEach(r => {
    const [veta, hl] = r.split('|').map(x => x.trim());
    const ans = (veta.match(/\*(.+?)\*/) || [])[1];
    const kl = (hl || ans || '').toLowerCase();
    const w = k.w.find(x => x.en.toLowerCase() === kl);
    if (!w || !ans) { k.vtChyby.push(r); return; }
    k.vt.push({ id: w.id, w, veta, ans });
    if (!w.veta) { w.veta = veta; w.ans = ans; }
  });
  k.v = riadky(k.slovesa).map(r => {
    const [t, sk] = r.split('|');
    const [p, pa, pp] = t.split(',').map(s => s.trim());
    return { id: 'v#' + p, p, pa, pp, sk: sk.trim() };
  });
  k.skupiny = [...new Set(k.w.map(w => skupina(w.L)))].sort((a, b) => a - b);
}
const FRAZY = 100;
const skupina = L => L >= 1000 ? FRAZY : Math.floor((L - 1) / 10);
const skupinaNazov = g => g === FRAZY ? 'Frázy' : (g * 10 + 1) + '–' + (g * 10 + 10);
const skupinaPopis = g => g === FRAZY ? 'Frázy z gramatických lekcií' : 'Lekcie ' + skupinaNazov(g);

function nastavKnihu(){
  K = KNIHY.find(k => k.uroven === profil().uroven);
  if (!K) return false;
  pripravKnihu(K);
  P = load(kluc('p_' + K.id), { m: {}, ch: {}, s: {}, mod: {} });
  P.s = P.s || {}; P.mod = P.mod || {};
  if (!S.skup[K.id] || !S.skup[K.id].length) S.skup[K.id] = K.skupiny.slice();
  return true;
}
const vybraneSkup = () => S.skup[K.id];
const pool = () => K.w.filter(w => vybraneSkup().includes(skupina(w.L)));
const vetyVPool = () => K.vt.filter(x => vybraneSkup().includes(skupina(x.w.L)));
const m = id => P.m[id] || 0;
const NAUCENE = 4;

function zapis(id, ok, mod){
  if (ok) { P.m[id] = Math.min(5, m(id) + 1); if (m(id) >= 3) delete P.ch[id]; }
  else { P.m[id] = Math.max(0, m(id) - 2); P.ch[id] = Date.now(); }
  const s = P.s[id] || [0, 0]; s[0]++; if (ok) s[1]++; P.s[id] = s;
  const md = mod || (R && R.mod) || 'slova'; const t = P.mod[md] || [0, 0]; t[0]++; if (ok) t[1]++; P.mod[md] = t;
  const d = D[den()] = typeof D[den()] === 'object' ? D[den()] : { n: D[den()] || 0, ok: 0 };
  d.n++; if (ok) d.ok++;
  save(kluc('p_' + K.id), P); save(kluc('dni'), D);
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const dnesN = () => { const d = D[den()]; return typeof d === 'object' ? d.n : (d || 0); };
// zvládnutie skupiny slov v % (0–5 bodov za slovo)
const zvladnute = ws => ws.length ? Math.round(ws.reduce((a, w) => a + m(w.id), 0) / (ws.length * 5) * 100) : 0;
function uspesnost(ws){ let n = 0, ok = 0; ws.forEach(w => { const s = P.s[w.id]; if (s) { n += s[0]; ok += s[1]; } }); return { n, ok, p: pct(ok, n) }; }
// čo nejde: skúšané slová s najnižšou úspešnosťou
function slabe(ws, max){
  return ws.filter(w => P.s[w.id] && (P.ch[w.id] || P.s[w.id][1] < P.s[w.id][0]))
    .map(w => ({ w, p: P.s[w.id][1] / P.s[w.id][0], ch: P.ch[w.id] ? 1 : 0 }))
    .sort((a, b) => b.ch - a.ch || a.p - b.p || m(a.w.id) - m(b.w.id)).slice(0, max).map(x => x.w);
}
function seria(){
  const d = new Date(); let n = 0;
  if (!D[den(d)]) d.setDate(d.getDate() - 1);
  while (D[den(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// vážený výber: čo nevieš a kde si sa mýlil, príde častejšie
function vyber(arr, n){
  return arr.map(w => { const v = (6 - m(w.id)) ** 2 + (P.ch[w.id] ? 20 : 0); return { w, k: Math.random() ** (1 / v) }; })
    .sort((a, b) => b.k - a.k).slice(0, n).map(x => x.w);
}
function moznosti(spravna, kandidati){
  const out = [];
  for (const c of mix(kandidati)) { if (c && c !== spravna && !out.includes(c)) out.push(c); if (out.length === 3) break; }
  return mix([spravna, ...out]);
}

let hlas = null;
function najdiHlas(){ try { const v = speechSynthesis.getVoices(); hlas = v.find(x => /en[-_]GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; } catch(e){} }
try { najdiHlas(); speechSynthesis.onvoiceschanged = najdiHlas; } catch(e){}
function povedz(t){
  if (!t) return;
  const text = String(t).replace(/\*/g, '').replace(/\.\.\./g, ' ').replace(/\(.*?\)/g, '').replace(/\//g, ' or ');
  // v Android appke číta hlas telefónu (WebView nepozná speechSynthesis)
  if (window.AndroidHlas) { try { AndroidHlas.povedz(text); } catch(e){} return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; if (hlas) u.voice = hlas; u.rate = .9;
    speechSynthesis.speak(u);
  } catch(e){}
}
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

    <button class="tile big" data-m="chyby"><span class="ico" style="color:var(--bad)">!</span><span class="txt"><b>Opakuj chyby</b><small>${chyby ? chyby + ' slov, ktoré ti ešte nejdú' : 'Zatiaľ žiadne chyby'}</small></span></button>

  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {

/* ---------- tvorba otázok ---------- */
const smerEN = () => S.smer === 'en' || (S.smer === 'mix' && Math.random() < .5);
const vetaHtml = (veta, prazdna) => esc(veta).replace(/\*(.+?)\*/, (_, x) => prazdna ? '<span class="blank">&nbsp;?&nbsp;</span>' : '<mark>' + x + '</mark>');
const ed = p => { const [a, ...r] = p.split(' '); const z = /e$/.test(a) ? a + 'd' : /[^aeiou]y$/.test(a) ? a.slice(0, -1) + 'ied' : a + 'ed'; return [z, ...r].join(' '); };

function otazkaSlovo(w, kand){
  const en = smerEN();
  const ine = kand.filter(x => x.sk !== w.sk && x.en !== w.en);
  return en
    ? { w, lbl:'EN → SK', prompt: esc(w.en), sayEn: w.en, sub:'Vyber po slovensky', opts: moznosti(w.sk, ine.map(x => x.sk)), ans: w.sk,
        po: w.veta ? vetaHtml(w.veta) : '' }
    : { w, lbl:'SK → EN', prompt: esc(w.sk), sub:'Vyber po anglicky', opts: moznosti(w.en, ine.map(x => x.en)), ans: w.en, sayAfter: w.en,
        po: w.veta ? vetaHtml(w.veta) : '' };
}

function otazky(mod){
  const n = S.dlzka, p = pool();
  if (mod === 'slova') return vyber(p, n).map(w => otazkaSlovo(w, p));
  if (mod === 'chyby') {
    const ch = K.w.filter(w => P.ch[w.id]);
    if (!ch.length) { toast('Zatiaľ nemáš žiadne chyby. Super!'); return null; }
    return vyber(ch, n).map(w => otazkaSlovo(w, K.w));
  }
  if (mod === 'obrazky') {
    const e = p.filter(w => w.em), all = K.w.filter(w => w.em);
    if (e.length < 1) { toast('V týchto lekciách nie sú obrázky. Vyber viac lekcií.'); return null; }
    return vyber(e, n).map(w => ({ w, lbl:'Čo je na obrázku?', prompt: w.em, emoji: true, sub:'Vyber anglické slovo',
      opts: moznosti(w.en, all.filter(x => x.en !== w.en).map(x => x.en)), ans: w.en, sayAfter: w.en, po: '<b>' + esc(w.en) + '</b> = ' + esc(w.sk) }));
  }
  if (mod === 'vety') {
    const v = vetyVPool();
    if (!v.length) { toast('V týchto lekciách zatiaľ nie sú vety. Vyber viac lekcií.'); return null; }
    return vyber(v, n).map(x => ({ w: x.w, lbl:'Doplň vetu', prompt: vetaHtml(x.veta, true), veta: true, sub:'Ktoré slovo chýba?', hint: x.w.sk,
      opts: moznosti(x.ans, K.vt.filter(y => y.ans.toLowerCase() !== x.ans.toLowerCase()).map(y => y.ans)), ans: x.ans,
      sayAfter: x.veta, po: vetaHtml(x.veta) }));
  }
  if (mod === 'slovesa') {
    return vyber(K.v, n).map(otazkaSloveso);
  }
}

function otazkaSloveso(v){
  const typ = ['pa', 'pp', 'all'][Math.floor(Math.random() * 3)];
  const ostatne = mix(K.v.filter(x => x !== v));
  const troj = x => x.p + ' – ' + x.pa + ' – ' + x.pp, trojica = troj(v), e = ed(v.p);
  let q;
  // najprv mätúce tvary toho istého slovesa, potom tvary iných slovies ako záloha
  if (typ === 'pa') q = { sub: v.sk + ' · <b>2. tvar</b> (minulý čas)', ans: v.pa, vlastne: [v.pp, v.p, e], ine: ostatne.map(x => x.pa) };
  else if (typ === 'pp') q = { sub: v.sk + ' · <b>3. tvar</b> (past participle)', ans: v.pp, vlastne: [v.pa, v.p, e], ine: ostatne.map(x => x.pp) };
  else q = { sub: v.sk + ' · <b>všetky tri tvary</b>', ans: trojica,
    vlastne: mix([[v.p, v.pp, v.pa], [v.p, e, e], [v.p, v.pa, v.pa], [v.p, v.pp, v.pp], [v.p, v.p, v.pp], [v.p, v.pa, e]].map(a => a.join(' – '))),
    ine: ostatne.map(troj) };
  const opts = [q.ans];
  for (const c of [...q.vlastne, ...q.ine]) { if (opts.length === 4) break; if (c && !opts.includes(c)) opts.push(c); }
  return { w: v, lbl: 'Nepravidelné slovesá', prompt: esc(v.p), sayEn: v.p, sub: q.sub, opts: mix(opts), ans: q.ans, sayAfter: trojica.replace(/ – /g, ', '),
    po: '<b>' + esc(trojica) + '</b>' };
}

/* ---------- kvíz ---------- */
let R;
function spusti(mod){
  if (mod === 'zoznam') return zoznam();
  if (mod === 'karticky') return karticky();
  if (mod === 'pisanie') return pisanie();
  const q = otazky(mod);
  if (!q || !q.length) return;
  R = { mod, q, i: 0, ok: 0, zle: [] };
  otazka();
}
function hlavicka(){
  return `<div class="bar"><button class="ghost" id="koniec" aria-label="Späť do menu">✕</button>
    <div class="progress"><i style="width:${R.i / R.q.length * 100}%"></i></div><span class="num">${R.i + 1} / ${R.q.length}</span></div>`;
}
function otazka(){
  const q = R.q[R.i];
  app.innerHTML = hlavicka() + `
  <section class="q">
    <div class="lbl">${q.lbl}</div>
    <div class="prompt ${q.emoji ? 'emoji' : ''} ${q.veta ? 'veta' : ''}"><span>${q.prompt}</span>${q.sayEn ? '<button class="say" id="say" aria-label="Prehrať">🔊</button>' : ''}</div>
    <div class="sub">${q.sub}</div>
    ${q.hint ? '<button class="ghost" id="hint">Nápoveda: po slovensky</button>' : ''}
  </section>
  <div class="opts">${q.opts.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join('')}</div>
  <div class="fb" id="fb" hidden></div>`;
  document.getElementById('koniec').onclick = domov;
  if (q.sayEn) { document.getElementById('say').onclick = () => povedz(q.sayEn); if (S.zvuk) povedz(q.sayEn); }
  const h = document.getElementById('hint'); if (h) h.onclick = () => { h.outerHTML = '<div class="hint">= ' + esc(q.hint) + '</div>'; };
  app.querySelectorAll('.opts button').forEach(b => b.onclick = () => odpoved(q, b));
  window.scrollTo(0, 0);
}
function odpoved(q, b){
  const zvol = q.opts[+b.dataset.i], ok = zvol === q.ans;
  app.querySelectorAll('.opts button').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.i] === q.ans) x.classList.add('ok'); });
  if (!ok) b.classList.add('bad');
  zapis(q.w.id, ok);
  if (ok) R.ok++; else R.zle.push(q.w);
  if (S.zvuk && q.sayAfter) povedz(q.sayAfter);
  const fb = document.getElementById('fb');
  fb.hidden = false;
  fb.innerHTML = `<div class="res ${ok ? 'ok' : 'bad'}">${ok ? 'Správne!' : 'Správne je: ' + esc(q.ans)}</div>
    ${q.po ? `<div class="ex">${q.po}</div>` : ''}
    <button class="primary" id="dalej">Ďalej</button>`;
  const tlacidlo = document.getElementById('dalej'), kolo = R;
  const dalej = () => { R.i++; R.i < R.q.length ? otazka() : vysledok(); };
  tlacidlo.onclick = dalej;
  // automaticky ďalej len ak je človek stále na tej istej otázke (nie po odchode do menu alebo iného cvičenia)
  // po správnej odpovedi rýchlo ďalej (s vetou o chvíľu dlhšie, nech sa dá prečítať); po chybe čaká na „Ďalej“
  if (ok) setTimeout(() => { if (R === kolo && R.q[R.i] === q && document.body.contains(tlacidlo)) dalej(); }, q.po ? 1100 : 450);
  fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function vysledok(){
  const n = R.q.length, zle = [...new Map(R.zle.map(w => [w.id, w])).values()];
  app.innerHTML = `
  <h1>Hotovo</h1>
  <div class="score">${pct(R.ok, n)} %</div>
  <p class="sub" style="text-align:center;margin:0">${R.ok} z ${n} správne${R.ok === n ? ' · bez chyby!' : ''}</p>
  <div class="progress"><i style="width:${R.ok / n * 100}%"></i></div>
  ${zle.length ? `<h2>Tieto si zopakuj</h2><div class="list">${zle.map(w => polozka(w)).join('')}</div>` : '<p class="empty">Všetko správne. Výborne!</p>'}
  ${zle.length ? '<button class="primary" id="znovaZle">Precvič len tieto</button>' : ''}
  <button class="${zle.length ? '' : 'primary'}" id="celeZnova">Celé kolo znova od začiatku</button>
  <button id="znova">Nové kolo s inými slovami</button>
  <button id="menu">Menu</button>`;
  bindPolozky();
  const zz = document.getElementById('znovaZle');
  const opakuj = q => { const mod = R.mod; if (mod === 'pisanie') return pisanie(q.map(x => x.w || x)); R = { mod, q: mix(q).map(x => Object.assign({}, x, { opts: mix(x.opts) })), i: 0, ok: 0, zle: [] }; otazka(); };
  const vsetky = R.q;
  document.getElementById('celeZnova').onclick = () => opakuj(vsetky);
  if (zz) zz.onclick = () => {
    const mod = R.mod;
    if (mod === 'pisanie') return pisanie(zle);
    const q = mod === 'slovesa' || mod === 'vety' || mod === 'obrazky'
      ? R.q.filter(x => zle.includes(x.w)).map(x => Object.assign({}, x, { opts: mix(x.opts) }))
      : zle.map(w => otazkaSlovo(w, K.w));
    R = { mod, q: mix(q), i: 0, ok: 0, zle: [] }; otazka();
  };
  document.getElementById('znova').onclick = () => spusti(R.mod);
  document.getElementById('menu').onclick = domov;
  window.scrollTo(0, 0);
}
function polozka(w){
  const en = w.en || (w.p + ' – ' + w.pa + ' – ' + w.pp), mm = m(w.id);
  return `<div class="it" data-say="${esc(w.en || [w.p, w.pa, w.pp].join(', '))}" role="button" tabindex="0">
    <span class="en">${esc(en)}</span><span class="sk">${esc(w.sk)}</span>
    <span class="dots" aria-label="Zvládnutie ${mm} z 5">${[1,2,3,4,5].map(i => `<i class="${i <= mm ? 'on' : ''}"></i>`).join('')}</span></div>`;
}
function bindPolozky(){ app.querySelectorAll('[data-say]').forEach(el => el.onclick = () => povedz(el.dataset.say)); }

/* ---------- kartičky ---------- */
function karticky(){
  const p = pool(); if (!p.length) return;
  let rad = vyber(p, S.dlzka), hotovo = 0, celkom = rad.length, otocena = false;
  const kresli = () => {
    if (!rad.length) { toast('Kartičky hotové'); return domov(); }
    const w = rad[0], en = smerEN();
    otocena = false;
    app.innerHTML = `<div class="bar"><button class="ghost" id="koniec" aria-label="Späť do menu">✕</button>
      <div class="progress"><i style="width:${hotovo / celkom * 100}%"></i></div><span class="num">${hotovo} / ${celkom}</span></div>
      <button class="flash" id="karta"><span class="lbl">Ťukni a otoč</span><span class="front">${esc(en ? w.en : w.sk)}</span><span id="zad" hidden></span></button>
      <div class="two" id="hod" hidden><button class="no" id="nie">Ešte neviem</button><button class="yes" id="ano">Viem</button></div>`;
    document.getElementById('koniec').onclick = domov;
    if (en && S.zvuk) povedz(w.en);
    document.getElementById('karta').onclick = () => {
      if (otocena) { povedz(w.en); return; }
      otocena = true;
      const z = document.getElementById('zad');
      z.hidden = false; z.style.display = 'contents';
      z.innerHTML = `<span class="back">${esc(en ? w.sk : w.en)}</span>${w.veta ? `<span class="ex">${vetaHtml(w.veta)}</span>` : ''}`;
      document.querySelector('#karta .lbl').textContent = 'Ťukni pre výslovnosť';
      document.getElementById('hod').hidden = false;
      if (S.zvuk) povedz(w.en);
    };
    document.getElementById('nie').onclick = () => { zapis(w.id, false, 'karticky'); rad.push(rad.shift()); kresli(); };
    document.getElementById('ano').onclick = () => { zapis(w.id, true, 'karticky'); rad.shift(); hotovo++; kresli(); };
  };
  kresli();
}

/* ---------- písanie ---------- */
const norm = s => s.toLowerCase().replace(/[’`]/g, "'").replace(/\.\.\.|[?!.]/g, '').replace(/\s+/g, ' ').trim();
const varianty = en => [...new Set([norm(en), norm(en.replace(/\(.*?\)/g, '')), norm(en.replace(/[()]/g, ''))])];
function pisanie(slova){
  const p = pool(); if (!p.length) return;
  R = { mod: 'pisanie', q: slova ? mix(slova) : vyber(p, S.dlzka), i: 0, ok: 0, zle: [] };
  const kresli = () => {
    const w = R.q[R.i]; let napovedy = 0, hotove = false;
    const ciel = w.en.replace(/\s*\(.*?\)/g, '');
    const maska = () => ciel.split('').map((c, i) => i < napovedy || !/[a-z]/i.test(c) ? c : '_').join('');
    app.innerHTML = hlavicka() + `
      <section class="q"><div class="lbl">Napíš po anglicky</div><div class="prompt">${esc(w.sk)}</div>
        <div class="letters" id="maska">${esc(maska())}</div></section>
      <form id="f" autocomplete="off"><input class="write" id="vstup" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Odpoveď po anglicky"></form>
      <div class="two"><button id="hint">Ukáž písmeno</button><button class="primary" id="over">Skontroluj</button></div>
      <div class="fb" id="fb" hidden></div>`;
    document.getElementById('koniec').onclick = domov;
    const vstup = document.getElementById('vstup'); vstup.focus();
    document.getElementById('hint').onclick = () => { if (hotove) return; napovedy = Math.min(ciel.length, napovedy + 1); document.getElementById('maska').textContent = maska(); vstup.focus(); };
    const over = () => {
      if (hotove) return; hotove = true;
      const ok = varianty(w.en).includes(norm(vstup.value));
      vstup.classList.add(ok ? 'ok' : 'bad'); vstup.readOnly = true;
      if (ok && napovedy === 0) zapis(w.id, true, 'pisanie'); else if (!ok) zapis(w.id, false, 'pisanie');
      if (ok) R.ok++; else R.zle.push(w);
      if (S.zvuk) povedz(w.en);
      const fb = document.getElementById('fb'); fb.hidden = false;
      fb.innerHTML = `<div class="res ${ok ? 'ok' : 'bad'}">${ok ? (napovedy ? 'Správne, s nápovedou' : 'Správne!') : 'Správne je: ' + esc(w.en)}</div>
        ${w.veta ? `<div class="ex">${vetaHtml(w.veta)}</div>` : ''}<button class="primary" id="dalej">Ďalej</button>`;
      const d = document.getElementById('dalej'); d.focus();
      d.onclick = () => { R.i++; R.i < R.q.length ? kresli() : vysledok(); };
    };
    document.getElementById('over').onclick = over;
    document.getElementById('f').onsubmit = e => { e.preventDefault(); over(); };
  };
  kresli();
}

/* ---------- zoznam ---------- */
function zoznam(){
  app.innerHTML = `<div class="bar"><button class="ghost" id="koniec">← Menu</button><h1 style="font-size:20px">Zoznam slov</h1></div>
    <input class="search" id="hladaj" placeholder="Hľadaj po anglicky alebo po slovensky" aria-label="Hľadať">
    <div class="seg" style="grid-template-columns:1fr 1fr"><button class="on" data-t="s">Slová vo vybraných lekciách</button><button data-t="v" ${K.v.length ? '' : 'hidden'}>Slovesá</button></div>
    <div id="vypis"></div>`;
  let typ = 's';
  const kresli = () => {
    const q = norm(document.getElementById('hladaj').value);
    const zdroj = typ === 's' ? pool() : K.v;
    const f = zdroj.filter(w => !q || norm((w.en || w.p + ' ' + w.pa + ' ' + w.pp) + ' ' + w.sk).includes(q));
    if (typ === 's') {
      const g = {}; f.forEach(w => (g[skupina(w.L)] = g[skupina(w.L)] || []).push(w));
      document.getElementById('vypis').innerHTML = Object.keys(g).length ? Object.keys(g).sort((a, b) => a - b).map(k =>
        `<h2 style="margin:14px 0 8px">${skupinaPopis(+k)}</h2><div class="list">${g[k].sort((a, b) => a.L - b.L || a.en.localeCompare(b.en)).map(w => polozka(w)).join('')}</div>`).join('')
        : '<p class="empty">Nič som nenašiel.</p>';
    } else {
      document.getElementById('vypis').innerHTML = f.length ? `<div class="list">${f.map(v => polozka(v)).join('')}</div>` : '<p class="empty">Nič som nenašiel.</p>';
    }
    bindPolozky();
  };
  document.getElementById('koniec').onclick = domov;
  document.getElementById('hladaj').oninput = kresli;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { typ = b.dataset.t; app.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); kresli(); });
  kresli();
}

window.androidSpat = () => {
  for (const id of ['koniec', 'spat']) { const b = document.getElementById(id); if (b) { b.click(); return 'ok'; } }
  if (document.getElementById('menu')) { document.getElementById('menu').click(); return 'ok'; }
  return 'koniec';
};

/* ---------- inštalácia na plochu ---------- */
let instal = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instal = e; const b = document.getElementById('instal'); if (b) { b.hidden = false; document.getElementById('instalTxt').textContent = 'Bude na ploche ako ikona a pôjde aj bez internetu.'; } });
const jeApp = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch(e) { return false; } };
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function instalHtml(){
  if (jeApp() || !/^https?:/.test(location.protocol)) return '';
  const txt = iOS ? 'V Safari ťukni dole na Zdieľať (štvorček so šípkou) a potom na Pridať na plochu.'
    : instal ? 'Bude na ploche ako ikona a pôjde aj bez internetu.' : 'V Chrome ťukni vpravo hore na ⋮ a potom na Inštalovať aplikáciu (alebo Pridať na plochu).';
  return `<section class="card instal"><h2>Nainštaluj si appku</h2><p id="instalTxt" style="margin:0">${txt}</p>${iOS ? '' : `<button class="primary" id="instal" ${instal ? '' : 'hidden'}>Inštalovať</button>`}</section>`;
}
function bindInstal(){
  const b = document.getElementById('instal');
  if (b) b.onclick = async () => { if (!instal) return; instal.prompt(); try { await instal.userChoice; } catch(e){} instal = null; b.closest('.instal').remove(); };
}
window.addEventListener('appinstalled', () => { const c = document.querySelector('.instal'); if (c) c.remove(); });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
// požiadať prehliadač, aby pokrok nemazal pri nedostatku miesta
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}

/* ---------- profily ---------- */
const MODY_NAZ = { slova:'Slovíčka', obrazky:'Obrázky', vety:'Doplň vetu', slovesa:'Nepravidelné slovesá', karticky:'Kartičky', pisanie:'Napíš slovo', chyby:'Opakuj chyby' };
function kto(){
  app.innerHTML = `
  <div class="top"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 4h14l12 16-12 16H8l12-16z" fill="var(--brand)"/></svg><h1>Kto sa učí?</h1></div>
  ${U.list.length ? `<div class="list">${U.list.map(p => `<button class="it prof" data-id="${p.id}"><span class="avatar sm">${esc(p.meno.slice(0, 1).toUpperCase())}</span><span class="en">${esc(p.meno)}</span><span class="sk">${p.uroven ? 'úroveň ' + p.uroven : 'vyber úroveň'} →</span></button>`).join('')}</div>` : '<p class="sub">Napíš svoje meno. Appka si bude pamätať tvoj pokrok na tomto zariadení.</p>'}
  <form id="novy" class="row" autocomplete="off">
    <input class="search" id="meno" maxlength="24" placeholder="${U.list.length ? 'Pridať ďalšie meno' : 'Tvoje meno'}" aria-label="Meno" style="flex:1;min-width:0">
    <button class="primary" type="submit">${U.list.length ? 'Pridať' : 'Začať'}</button>
  </form>
  ${instalHtml()}`;
  bindInstal();
  app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => prihlas(b.dataset.id));
  document.getElementById('novy').onsubmit = e => {
    e.preventDefault();
    const meno = document.getElementById('meno').value.trim();
    if (!meno) return;
    const id = 'u' + Date.now().toString(36);
    U.list.push({ id, meno }); save('sl2_profily', U); prihlas(id);
  };
}

function profilObr(){
  const us = uspesnost(K.w), zv = zvladnute(K.w), sr = seria();
  const nauc = K.w.filter(w => m(w.id) >= NAUCENE).length, skusane = K.w.filter(w => P.s[w.id]).length;
  const zle = slabe([...K.w, ...K.v], 15);
  const dni = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const x = D[den(d)]; dni.push({ d, n: typeof x === 'object' ? x.n : (x || 0) }); }
  const maxDen = Math.max(10, ...dni.map(x => x.n));
  const vs = uspesnost(K.v), vz = zvladnute(K.v);
  app.innerHTML = `
  <div class="bar"><button class="ghost" id="spat">← Menu</button></div>
  <div class="top"><span class="avatar">${esc(profil().meno.slice(0, 1).toUpperCase())}</span><div style="min-width:0"><h1>${esc(profil().meno)}</h1><div class="kniha">Úroveň ${K.uroven} · ${esc(K.nazov)}</div></div></div>

  <div class="hero">
    <span class="kpi"><b>${zv} %</b><small>zvládnuté</small></span>
    <span class="kpi"><b>${us.n ? us.p + ' %' : '–'}</b><small>úspešnosť</small></span>
    <span class="kpi"><b>${nauc}</b><small>naučených slov</small></span>
    <span class="kpi"><b>${skusane}</b><small>vyskúšaných</small></span>
  </div>

  <section class="card">
    <h2>Posledných 7 dní · ${sr} ${sr === 1 ? 'deň' : sr >= 2 && sr <= 4 ? 'dni' : 'dní'} po sebe</h2>
    <div class="days">${dni.map(x => `<div class="day"><span class="col"><i style="height:${x.n / maxDen * 100}%"></i></span><b>${x.n || ''}</b><small>${['Ne','Po','Ut','St','Št','Pi','So'][x.d.getDay()]}</small></div>`).join('')}</div>
  </section>

  <section class="card">
    <h2>Čo ti nejde</h2>
    ${zle.length ? `<div class="list flat">${zle.map(w => { const s = P.s[w.id]; return polozka(w).replace('<span class="dots"', `<span class="pp bad">${pct(s[1], s[0])} %</span><span class="dots"`); }).join('')}</div>
      <button class="primary" id="precvic">Precvič tieto slová</button>` : '<p class="sub">Zatiaľ nič. Keď sa pomýliš, slovo sa objaví tu.</p>'}
  </section>

  <section class="card">
    <h2>Lekcie</h2>
    <div class="rows">${K.skupiny.map(g => { const ws = K.w.filter(w => skupina(w.L) === g), z = zvladnute(ws), u = uspesnost(ws);
      return `<div class="rowp"><span>${skupinaPopis(g)}</span><span class="progress"><i style="width:${z}%"></i></span><b>${z} %</b><small>${u.n ? u.p + ' % správne' : 'neskúšané'}</small></div>`; }).join('')}
      ${K.v.length ? `<div class="rowp"><span>Nepravidelné slovesá</span><span class="progress"><i style="width:${vz}%"></i></span><b>${vz} %</b><small>${vs.n ? vs.p + ' % správne' : 'neskúšané'}</small></div>` : ''}
    </div>
  </section>

  <section class="card">
    <h2>Úspešnosť podľa cvičenia</h2>
    <div class="rows">${Object.keys(MODY_NAZ).map(k => { const t = P.mod[k]; return `<div class="rowp"><span>${MODY_NAZ[k]}</span><span class="progress"><i style="width:${t ? pct(t[1], t[0]) : 0}%"></i></span><b>${t ? pct(t[1], t[0]) + ' %' : '–'}</b><small>${t ? t[0] + ' odpovedí' : ''}</small></div>`; }).join('')}</div>
  </section>

  <div class="two"><button id="zmenU">Zmeniť úroveň</button><button id="zmen">Zmeniť profil</button></div>
  <button id="reset" class="no">Vynulovať pokrok tejto úrovne</button>
  <p class="sub" style="text-align:center;font-size:13px">Pokrok sa ukladá len v tomto zariadení a prehliadači.</p>`;
  document.getElementById('spat').onclick = domov;
  document.getElementById('zmen').onclick = () => { U.akt = null; save('sl2_profily', U); kto(); };
  document.getElementById('zmenU').onclick = urovenObr;
  bindPolozky();
  const pr = document.getElementById('precvic');
  if (pr) pr.onclick = () => {
    const q = zle.map(w => w.en ? otazkaSlovo(w, K.w) : otazkaSloveso(w));
    R = { mod: 'chyby', q: mix(q), i: 0, ok: 0, zle: [] }; otazka();
  };
  const rs = document.getElementById('reset');
  rs.onclick = () => {
    if (rs.dataset.potvrd) { P = { m: {}, ch: {}, s: {}, mod: {} }; save(kluc('p_' + K.id), P); toast('Pokrok vynulovaný'); return profilObr(); }
    rs.dataset.potvrd = 1; rs.textContent = 'Naozaj? Ťukni znova';
  };
  window.scrollTo(0, 0);
}

function urovenObr(){
  const p = profil();
  app.innerHTML = `
  <div class="top"><span class="avatar" style="margin-left:0">${esc(p.meno.slice(0, 1).toUpperCase())}</span><div style="min-width:0"><h1>Akú úroveň máš?</h1><div class="kniha">${esc(p.meno)} · podľa čísla na obálke knihy</div></div></div>
  <div class="levels">${UROVNE.map(u => { const k = KNIHY.find(x => x.uroven === u);
    return k ? `<button class="level ${p.uroven === u ? 'on' : ''}" data-u="${u}"><b>${u}</b><small>${(pripravKnihu(k), k.w.length)} slov</small></button>`
      : `<button class="level zamk" disabled aria-label="Úroveň ${u} je zamknutá"><b>${u}</b><small><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7zm2 0h4V5a2 2 0 0 0-4 0z" fill="currentColor"/></svg> zamknuté</small></button>`; }).join('')}</div>
  <p class="sub" style="margin:0">Zamknuté úrovne sa odomknú, keď pribudnú slovíčka z ich knihy.</p>
  ${p.uroven ? '<button id="spat">Späť</button>' : ''}`;
  app.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { p.uroven = +b.dataset.u; save('sl2_profily', U); nastavKnihu() ? domov() : pripravujeme(); });
  const sp = document.getElementById('spat'); if (sp) sp.onclick = () => nastavKnihu() ? domov() : pripravujeme();
  window.scrollTo(0, 0);
}
function pripravujeme(){
  const p = profil();
  app.innerHTML = `
  <div class="top"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 4h14l12 16-12 16H8l12-16z" fill="var(--brand)"/></svg><div style="min-width:0"><h1>Slovíčka</h1><div class="kniha">${esc(p.meno)} · úroveň ${p.uroven}</div></div></div>
  <section class="card"><h2>Úroveň ${p.uroven} pripravujeme</h2>
    <p style="margin:0">Pre túto knihu ešte nemám slovíčka. Odfoť slovník na konci knihy (strany so slovami a číslami lekcií) a nepravidelné slovesá a pošli ich Marekovi.</p></section>
  <div class="two"><button id="zmenU">Zmeniť úroveň</button><button id="zmen">Zmeniť profil</button></div>`;
  document.getElementById('zmenU').onclick = urovenObr;
  document.getElementById('zmen').onclick = () => { U.akt = null; save('sl2_profily', U); kto(); };
}

if (U.akt && U.list.some(p => p.id === U.akt)) prihlas(U.akt); else kto();
</script>
